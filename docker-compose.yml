services:
  web:
    build: .
    env_file: ${ENV_FILE:-.env}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photoshare
      POSTGRES_USER: photoshare
      POSTGRES_PASSWORD: photoshare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoshare -d photoshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
