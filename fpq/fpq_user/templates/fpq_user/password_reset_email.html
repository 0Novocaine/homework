{% autoescape off %}
<p>Hi {{ user.username }},</p>
<p>Use this one-time link to set a new password:</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'fpq_user:password_reset_confirm' uidb64=uid token=token %}">{{ protocol }}://{{ domain }}{% url 'fpq_user:password_reset_confirm' uidb64=uid token=token %}</a></p>
<p>If you did not request a password reset, you can safely ignore this email.</p>
{% endautoescape %}
